name: Check Format

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install 📦
        run: npm ci

      - name: Check format 🎨
        run: npm run check-format
