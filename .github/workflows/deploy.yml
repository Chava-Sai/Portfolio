name: Build and Deploy

# Every push to master publishes the static export to gh-pages.
# Manual runs are still available from the Actions tab.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js 🔧
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install 📦
        run: npm ci

      - name: Typecheck 🔍
        run: npm run typecheck

      - name: Build static export 🏗️
        run: npm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          # next.config.mjs sets output: "export", which writes to out/
          folder: out
          # public/.nojekyll must survive — without it Pages runs Jekyll,
          # which ignores _next/ and the whole site loads unstyled
          clean: true
