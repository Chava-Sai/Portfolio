<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Srinivasa Sai Chava">
  <defs>
    <linearGradient id="sc-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="52%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#sc-tile)"/>

  <!-- one root fanning into three levels: the hierarchy this work is about -->
  <g stroke="#0b0b12" stroke-width="4.2" stroke-linecap="round" fill="none" opacity="0.92">
    <path d="M20 32 C 30 32, 32 17, 44 17"/>
    <path d="M20 32 H 44"/>
    <path d="M20 32 C 30 32, 32 47, 44 47"/>
  </g>

  <g fill="#0b0b12" opacity="0.95">
    <circle cx="20" cy="32" r="6.6"/>
    <circle cx="45" cy="17" r="4.6"/>
    <circle cx="45" cy="32" r="4.6"/>
    <circle cx="45" cy="47" r="4.6"/>
  </g>
</svg>
