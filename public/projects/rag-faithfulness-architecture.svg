<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1000" width="2000" height="1000" role="img" aria-label="Evaluating faithfulness and attribution in RAG systems — evaluation pipeline">
  <defs>
    <marker id="ra-arrow" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="ra-arrow-accent" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c084fc"/>
    </marker>
    <marker id="ra-arrow-dim" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <pattern id="ra-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="2000" height="1000" fill="#0b0f16"/>
  <rect width="2000" height="1000" fill="url(#ra-grid)"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">

    <!-- ── inputs ─────────────────────────────────────────────── -->
    <text x="60" y="62" fill="#64748b" font-size="20" font-family="ui-monospace, Menlo, monospace" letter-spacing="3">1 &#183; DATA</text>
    <g>
      <rect x="60" y="82" width="560" height="86" rx="12" fill="#101725" stroke="#1e293b" stroke-width="2"/>
      <text x="84" y="117" fill="#e2e8f0" font-size="25" font-weight="600">Natural Questions</text>
      <text x="84" y="147" fill="#94a3b8" font-size="21">1,000 test questions &#183; 21M-passage Wikipedia index</text>
      <rect x="640" y="82" width="300" height="86" rx="12" fill="#101725" stroke="#1e293b" stroke-width="2"/>
      <text x="664" y="117" fill="#e2e8f0" font-size="25" font-weight="600">ASQA</text>
      <text x="664" y="147" fill="#94a3b8" font-size="21">multi-answer &#183; 500</text>
      <rect x="960" y="82" width="340" height="86" rx="12" fill="#1a1020" stroke="#7e22ce" stroke-width="2"/>
      <text x="984" y="117" fill="#e9d5ff" font-size="25" font-weight="600">FEVER</text>
      <text x="984" y="147" fill="#c4b5fd" font-size="21">distractor passages &#183; E5</text>
    </g>

    <!-- ── the pipeline ───────────────────────────────────────── -->
    <text x="60" y="256" fill="#64748b" font-size="20" font-family="ui-monospace, Menlo, monospace" letter-spacing="3">2 &#183; PIPELINE</text>

    <g stroke="#1e293b" stroke-width="2" fill="#101725">
      <rect x="60"   y="276" width="190" height="104" rx="12"/>
      <rect x="310"  y="276" width="290" height="104" rx="12"/>
      <rect x="660"  y="276" width="230" height="104" rx="12"/>
      <rect x="950"  y="276" width="300" height="104" rx="12"/>
      <rect x="1310" y="276" width="250" height="104" rx="12"/>
    </g>
    <rect x="1620" y="276" width="320" height="104" rx="12" fill="#1a1020" stroke="#7e22ce" stroke-width="2"/>

    <g fill="#e2e8f0" font-size="25" font-weight="600">
      <text x="84"   y="320">Question</text>
      <text x="334"  y="320">Retriever</text>
      <text x="684"  y="320">Top-k passages</text>
      <text x="974"  y="320">Generator</text>
      <text x="1334" y="320">Claim splitter</text>
      <text x="1644" y="320" fill="#e9d5ff">NLI scorer</text>
    </g>
    <g fill="#94a3b8" font-size="20" font-family="ui-monospace, Menlo, monospace">
      <text x="84"   y="352">NQ &#183; ASQA</text>
      <text x="334"  y="352">BM25 &#183; Contriever</text>
      <text x="684"  y="352">k = 1, 3, 5, 10</text>
      <text x="974"  y="352">LLaMA-3.1-8B &#183; Mistral-7B</text>
      <text x="1334" y="352">answer &#8594; claims</text>
      <text x="1644" y="352" fill="#c4b5fd">DeBERTa-v3 &#183; &#964; = 0.5</text>
    </g>

    <g stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#ra-arrow)">
      <path d="M250 328 H 300"/>
      <path d="M600 328 H 650"/>
      <path d="M890 328 H 940"/>
      <path d="M1250 328 H 1300"/>
      <path d="M1560 328 H 1610"/>
    </g>

    <!-- data feeds the retriever -->
    <path d="M340 168 V 200 H 455 V 266" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#ra-arrow-dim)" stroke-dasharray="7 6"/>
    <!-- FEVER is injected into the retrieved set, which is the whole point of E5 -->
    <path d="M1130 168 V 214 H 775 V 266" stroke="#c084fc" stroke-width="2.5" fill="none" marker-end="url(#ra-arrow-accent)" stroke-dasharray="8 6"/>
    <text x="800" y="208" fill="#c084fc" font-size="20" font-style="italic">E5 injects distractors into the retrieved set</text>

    <!-- ── metrics ────────────────────────────────────────────── -->
    <text x="60" y="476" fill="#64748b" font-size="20" font-family="ui-monospace, Menlo, monospace" letter-spacing="3">3 &#183; WHAT IS MEASURED</text>

    <path d="M1780 380 V 440 H 430 V 496" stroke="#c084fc" stroke-width="2.5" fill="none" marker-end="url(#ra-arrow-accent)"/>
    <path d="M1120 440 V 496" stroke="#c084fc" stroke-width="2.5" fill="none" marker-end="url(#ra-arrow-accent)"/>

    <g>
      <rect x="60" y="506" width="740" height="132" rx="12" fill="#101725" stroke="#1e293b" stroke-width="2"/>
      <text x="84" y="546" fill="#e2e8f0" font-size="25" font-weight="600">Faithfulness</text>
      <text x="84" y="578" fill="#94a3b8" font-size="21">share of generated claims entailed by some retrieved passage</text>
      <text x="84" y="612" fill="#f0abfc" font-size="22" font-family="ui-monospace, Menlo, monospace">plain 0.089 &#183; grounded 0.100 &#183; CoT 0.068</text>

      <rect x="840" y="506" width="560" height="132" rx="12" fill="#101725" stroke="#1e293b" stroke-width="2"/>
      <text x="864" y="546" fill="#e2e8f0" font-size="25" font-weight="600">Soft retrieval relevance</text>
      <text x="864" y="578" fill="#94a3b8" font-size="21">share of passages that entail the gold answer</text>
      <text x="864" y="612" fill="#f0abfc" font-size="22" font-family="ui-monospace, Menlo, monospace">0.003 &#8594; 0.032 across retrievers</text>

      <rect x="1440" y="506" width="500" height="132" rx="12" fill="#101725" stroke="#1e293b" stroke-width="2"/>
      <text x="1464" y="546" fill="#e2e8f0" font-size="25" font-weight="600">RFG</text>
      <text x="1464" y="578" fill="#94a3b8" font-size="21">relevance &#8722; faithfulness, as a descriptive gap</text>
      <text x="1464" y="612" fill="#f0abfc" font-size="22" font-family="ui-monospace, Menlo, monospace">sign alone is not causal</text>
    </g>

    <!-- ── experiments ────────────────────────────────────────── -->
    <text x="60" y="706" fill="#64748b" font-size="20" font-family="ui-monospace, Menlo, monospace" letter-spacing="3">4 &#183; ABLATIONS</text>
    <g fill="#101725" stroke="#1e293b" stroke-width="2">
      <rect x="60"   y="726" width="360" height="92" rx="12"/>
      <rect x="440"  y="726" width="360" height="92" rx="12"/>
      <rect x="820"  y="726" width="360" height="92" rx="12"/>
      <rect x="1200" y="726" width="320" height="92" rx="12"/>
    </g>
    <rect x="1540" y="726" width="400" height="92" rx="12" fill="#1a1020" stroke="#7e22ce" stroke-width="2"/>
    <g font-size="23" font-weight="600" fill="#e2e8f0">
      <text x="84"   y="762">E1 &#183; retriever</text>
      <text x="464"  y="762">E2 &#183; generator</text>
      <text x="844"  y="762">E3 &#183; prompt style</text>
      <text x="1224" y="762">E4 &#183; top-k</text>
      <text x="1564" y="762" fill="#e9d5ff">E5 &#183; adversarial</text>
    </g>
    <g font-size="20" fill="#94a3b8" font-family="ui-monospace, Menlo, monospace">
      <text x="84"   y="794">BM25 0.082 vs Contriever 0.095</text>
      <text x="464"  y="794">LLaMA 0.097 vs Mistral 0.078</text>
      <text x="844"  y="794">grounded +12% &#183; CoT &#8722;24%</text>
      <text x="1224" y="794">k=10 &#8594; 0.147</text>
      <text x="1564" y="794" fill="#c4b5fd">support rises to 0.205</text>
    </g>

    <!-- ── the caveat the project is honest about ─────────────── -->
    <rect x="60" y="862" width="1880" height="98" rx="12" fill="#1a1020" stroke="#7e22ce" stroke-width="2" stroke-dasharray="10 7"/>
    <text x="84" y="900" fill="#e9d5ff" font-size="23" font-weight="600">Reported support rises when distractors are inserted &#8212; a property of the measure, not evidence of robustness.</text>
    <text x="84" y="934" fill="#c4b5fd" font-size="21">FEVER claims are sampled at random rather than matched to each question, so E5 is a distractor-insertion test. NLI and manual labels disagree (&#954; = &#8722;0.18, single annotator, exploratory).</text>
  </g>
</svg>
